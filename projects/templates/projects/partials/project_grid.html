{% if projects %}
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for project in projects %}
      {% include "projects/partials/project_card.html" %}
    {% endfor %}
  </div>

{% else %}
  <div class="text-center py-24 text-slate-400">
    <p class="text-lg">Nenhum projeto encontrado com esse filtro.</p>
    <button
      hx-get="{% url 'project_list' %}"
      hx-target="#project-grid"
      hx-push-url="{% url 'project_list' %}"
      class="mt-4 text-accent-400 hover:text-accent-300 transition-colors text-sm">
      Ver todos os projetos →
    </button>
  </div>
{% endif %}
