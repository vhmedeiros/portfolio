{% if success %}
  <!-- Estado de sucesso -->
  <div class="rounded-xl border border-accent-400/25 bg-surface-900 p-10 text-center">
    <div class="w-12 h-12 rounded-full bg-accent-400/10 flex items-center justify-center mx-auto mb-4">
      <svg class="w-6 h-6 text-accent-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h3 class="text-lg font-semibold text-slate-100 mb-2">Mensagem enviada!</h3>
    <p class="text-slate-400 text-sm mb-6">Obrigado pelo contato. Responderei em breve.</p>
    <button
      hx-get="{% url 'contact' %}"
      hx-target="#contact-form-wrapper"
      hx-swap="innerHTML"
      class="text-sm text-accent-400 hover:text-accent-300 transition-colors">
      Enviar outra mensagem →
    </button>
  </div>

{% else %}
  <!-- Formulário -->
  <form
    hx-post="{% url 'contact' %}"
    hx-target="#contact-form-wrapper"
    hx-swap="innerHTML"
    hx-indicator="#htmx-indicator"
    class="rounded-xl border border-white/5 bg-surface-900 p-6 sm:p-8 space-y-5">

    {% csrf_token %}

    {% for field in form %}
    <div>
      <label for="{{ field.id_for_label }}" class="block text-xs font-medium text-slate-400 mb-1.5">
        {{ field.label }}
      </label>
      <div class="[&>input]:w-full [&>input]:rounded-lg [&>input]:border [&>input]:border-surface-600
                  [&>input]:bg-surface-950 [&>input]:px-3.5 [&>input]:py-2.5
                  [&>input]:text-slate-100 [&>input]:text-base sm:[&>input]:text-sm [&>input]:outline-none
                  [&>input]:placeholder:text-slate-600
                  [&>input:focus]:border-accent-400/60 [&>input:focus]:ring-2 [&>input:focus]:ring-accent-400/15
                  [&>input]:transition-colors
                  [&>textarea]:w-full [&>textarea]:rounded-lg [&>textarea]:border [&>textarea]:border-surface-600
                  [&>textarea]:bg-surface-950 [&>textarea]:px-3.5 [&>textarea]:py-2.5
                  [&>textarea]:text-slate-100 [&>textarea]:text-base sm:[&>textarea]:text-sm [&>textarea]:outline-none
                  [&>textarea]:placeholder:text-slate-600 [&>textarea]:resize-none
                  [&>textarea:focus]:border-accent-400/60 [&>textarea:focus]:ring-2 [&>textarea:focus]:ring-accent-400/15
                  [&>textarea]:transition-colors">
        {{ field }}
      </div>
      {% if field.errors %}
        <p class="mt-1.5 text-xs text-red-400">{{ field.errors|join:", " }}</p>
      {% endif %}
    </div>
    {% endfor %}

    <button type="submit"
            class="w-full py-3 rounded-lg bg-accent-400 hover:bg-accent-300 text-surface-950 font-semibold text-sm transition-colors">
      Enviar mensagem
    </button>
  </form>
{% endif %}
